<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <title>Merge Conflict Counselling (16px)</title>
  <!--
    Pixel-grid icon for the 16x16 entry in favicon.ico. Two chevrons, not
    three: at this size the third is a smudge. Drawn on the grid by hand
    because downscaling favicon.svg turns the strokes to grey mush.
  -->
  <rect width="16" height="16" fill="#17211B"/>
  <g fill="#C69A5D">
    <!-- chevron 1, tip at x=1 -->
    <rect x="5" y="3" width="3" height="1"/>
    <rect x="4" y="4" width="3" height="1"/>
    <rect x="3" y="5" width="3" height="1"/>
    <rect x="2" y="6" width="3" height="1"/>
    <rect x="1" y="7" width="3" height="1"/>
    <rect x="1" y="8" width="3" height="1"/>
    <rect x="2" y="9" width="3" height="1"/>
    <rect x="3" y="10" width="3" height="1"/>
    <rect x="4" y="11" width="3" height="1"/>
    <rect x="5" y="12" width="3" height="1"/>
    <!-- chevron 2, tip at x=8 -->
    <rect x="12" y="3" width="3" height="1"/>
    <rect x="11" y="4" width="3" height="1"/>
    <rect x="10" y="5" width="3" height="1"/>
    <rect x="9"  y="6" width="3" height="1"/>
    <rect x="8"  y="7" width="3" height="1"/>
    <rect x="8"  y="8" width="3" height="1"/>
    <rect x="9"  y="9" width="3" height="1"/>
    <rect x="10" y="10" width="3" height="1"/>
    <rect x="11" y="11" width="3" height="1"/>
    <rect x="12" y="12" width="3" height="1"/>
  </g>
</svg>
